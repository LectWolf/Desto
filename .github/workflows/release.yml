name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $cmakeText = Get-Content -Raw CMakeLists.txt
          $projectVersion = [regex]::Match(
            $cmakeText, 'project\(Desto VERSION ([0-9]+\.[0-9]+\.[0-9]+)').Groups[1].Value
          $requested = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $env:INPUT_VERSION
          }
          if ($requested -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:\.[0-9]+)?$') {
            throw "Requested version $requested does not match project version $projectVersion."
          }
          $parts = $requested.Split('.')
          $baseVersion = ($parts[0..2] -join '.')
          if ($baseVersion -ne $projectVersion) {
            throw "Requested version $requested does not match project version $projectVersion."
          }
          $development = $parts.Count -eq 4
          $buildNumber = if ($development) { $parts[3] } else { '0' }
          "value=$requested" >> $env:GITHUB_OUTPUT
          "baseVersion=$baseVersion" >> $env:GITHUB_OUTPUT
          "buildNumber=$buildNumber" >> $env:GITHUB_OUTPUT
          "tag=v$requested" >> $env:GITHUB_OUTPUT
          "development=$($development.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Require an owner-selected project license
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath LICENSE -PathType Leaf)) {
            throw 'Select and commit the Desto host project license before creating a public release.'
          }

      - name: Configure
        run: >-
          cmake -S . -B build
          -DDESTO_BUILD_PROTOTYPES=OFF
          -DDESTO_BUILD_BENCHMARKS=ON

      - name: Build Release
        run: >-
          cmake --build build
          --config Release
          --parallel 4
          -- /nodeReuse:false

      - name: Test Release
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install Inno Setup compiler
        run: choco install innosetup --yes --no-progress

      - name: Build release assets
        shell: pwsh
        env:
          RELEASE_BASE_VERSION: ${{ steps.version.outputs.baseVersion }}
          RELEASE_DEVELOPMENT: ${{ steps.version.outputs.development }}
          RELEASE_BUILD_NUMBER: ${{ steps.version.outputs.buildNumber }}
        run: |
          if ($env:RELEASE_DEVELOPMENT -eq 'true') {
            & ./release/BuildRelease.ps1 `
              -Version $env:RELEASE_BASE_VERSION `
              -BuildDirectory 'build' `
              -OutputDirectory 'dist' `
              -BuildNumber ([int]$env:RELEASE_BUILD_NUMBER) `
              -Development `
              -RequireClean
          } else {
            & ./release/BuildRelease.ps1 `
              -Version $env:RELEASE_BASE_VERSION `
              -BuildDirectory 'build' `
              -OutputDirectory 'dist' `
              -BuildNumber ([int]$env:RELEASE_BUILD_NUMBER) `
              -RequireClean
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify release assets
        shell: pwsh
        run: >-
          ./release/VerifyRelease.ps1
          -ReleaseDirectory dist
          -ExpectedVersion '${{ steps.version.outputs.value }}'

      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Desto-${{ steps.version.outputs.value }}-win-x64
          path: |
            dist/Desto-*-win-x64-setup.exe
            dist/release-manifest.json
            dist/BUILDINFO.json
            dist/SHA256SUMS.txt
            dist/THIRD-PARTY-NOTICES.md
          if-no-files-found: error
          retention-days: 30

      - name: Create or update draft GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Desto-*-win-x64-setup.exe
            dist/release-manifest.json
            dist/BUILDINFO.json
            dist/SHA256SUMS.txt
            dist/THIRD-PARTY-NOTICES.md
